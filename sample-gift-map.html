<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sample gift map · Military World Travel</title>
<link rel="icon" href="/favicon.ico" sizes="any"/>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<meta name="description" content="A sample printed map of one soldier's duty stations, prepared as a farewell, retirement, or keepsake."/>
<meta property="og:title" content="Sample gift map"/>
<meta property="og:description" content="A sample printed map of one soldier's duty stations, prepared as a farewell, retirement, or keepsake."/>
<meta property="og:image" content="https://military-world-travel.netlify.app/assets/career-map-snuffy.png"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#f6f3ee;
  color:#1b2733;
  min-height:100vh;
}
a:focus-visible{outline:2px solid #C9962E;outline-offset:3px}
header{
  background:#04294A;
  color:#fff;
  padding:8px 16px;
  display:flex;
  align-items:center;
  gap:12px 16px;
  flex-wrap:wrap;
}
header h1{font-size:15px;font-weight:600;line-height:0}
header h1 a{display:inline-block;line-height:0}
header h1 img{height:46px;width:auto;display:block}
header .home{
  margin-left:auto;
  color:rgba(255,255,255,.82);
  font-size:13px;
  text-decoration:underline;
  text-underline-offset:2px;
  padding:8px 0;
}
header .home:hover{color:#fff}
main{
  max-width:760px;
  margin:0 auto;
  padding:28px 16px 48px;
}
.kicker{
  color:#04294A;
  font-size:12px;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.kicker::after{
  content:"";
  display:block;
  width:48px;
  height:2px;
  margin-top:10px;
  background:#C9962E;
}
h2{
  margin:14px 0 10px;
  color:#04294A;
  font-size:28px;
  line-height:1.25;
  font-weight:600;
  letter-spacing:-.01em;
}
.lead{
  font-size:16px;
  line-height:1.55;
  color:#44525f;
  max-width:38em;
}
.poster{margin:22px 0 0}
.poster a.sheet{display:block;cursor:pointer}
.poster img{
  width:100%;
  height:auto;
  display:block;
  background:#F5F0E6;
  box-shadow:0 12px 32px rgba(4,41,74,.12);
}
.actions{margin-top:16px}
.pdf{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:44px;
  padding:10px 16px;
  background:#04294A;
  color:#fff;
  text-decoration:none;
  border-radius:6px;
  font-weight:600;
  font-size:14px;
}
.pdf:hover{background:#0B3C66}
.fine{
  margin-top:14px;
  font-size:13px;
  line-height:1.5;
  color:#5b6875;
  max-width:40em;
}
.disclaimer{
  margin-top:22px;
  padding-top:16px;
  border-top:1px solid #e0d6c4;
  font-size:13px;
  line-height:1.5;
  color:#5c5348;
  max-width:40em;
}
@media (max-width:640px){
  header h1 img{height:40px}
  main{padding:22px 14px 36px}
  h2{font-size:24px}
  .pdf{width:100%}
}
</style>
</head>
<body>
<header>
  <h1><a href="/"><img src="/mwt-logo-header-reversed.svg" alt="Military World Travel" width="178" height="46"/></a></h1>
  <a class="home" href="/">Back to the map</a>
</header>
<main>
  <p class="kicker">Sample gift map</p>
  <h2>A map of a career</h2>
  <p class="lead">A printed map of one soldier's duty stations, prepared as a farewell, retirement, or family keepsake.</p>
  <figure class="poster">
    <a class="sheet" href="/assets/career-map-snuffy.pdf">
      <img src="/assets/career-map-snuffy.png" width="1944" height="2592" alt="Sample career map titled A Career of Service for LTC Snuffy, U.S. Army, retired. Numbered duty stations run from Germany to Bosnia and Herzegovina and Kosovo. The poster is marked SAMPLE."/>
    </a>
    <figcaption class="actions">
      <a class="pdf" href="/assets/career-map-snuffy.pdf">Open the full sample (PDF)</a>
      <p class="fine">The poster carries its own SAMPLE note. Dates, units, and deployment locations are still to be confirmed.</p>
    </figcaption>
  </figure>
  <p class="disclaimer">LTC SNUFFY is a placeholder name for this sample. This site is not affiliated with or endorsed by the U.S. Army or the Department of Defense.</p>
</main>
</body>
</html>
